# Servicios de apoyo para DESARROLLO LOCAL:
#   docker compose up -d
#   PostgreSQL → localhost:5432 · MinIO → http://localhost:9001 (consola) · Mailpit → http://localhost:8025
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inspecciones
      POSTGRES_PASSWORD: inspecciones
      POSTGRES_DB: inspecciones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspecciones"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Crea el bucket privado al arrancar.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/inspecciones;
      mc anonymous set none local/inspecciones;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
