# Despliegue completo en UN servidor (staging o producción):
#   PostgreSQL + migraciones + aplicación + Caddy (HTTPS automático)
#   Fotos y documentos: volumen "uploads" (STORAGE_DRIVER=local) o S3/R2 (STORAGE_DRIVER=s3)
#
#   cp .env.production.example .env.production   # completar valores reales
#   ln -sf .env.production .env                    # compose lee las variables de .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Variantes de HTTPS (servidor empresarial):
#   -f docker-compose.certificado.yml   certificado de la empresa (carpeta ./certs)
#   -f docker-compose.proxy-externo.yml la empresa ya tiene proxy HTTPS (sin Caddy)
#
# Guía de instalación: docs/INSTALACION.md
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspecciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-inspecciones}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspecciones}"]
      interval: 5s
      retries: 10

  # Aplica migraciones y sincroniza permisos/roles (y crea el administrador inicial).
  migrate:
    image: inspecciones-migrate:latest
    build:
      context: .
      target: migrate
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspecciones}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inspecciones}?schema=public
      SEED_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: inspecciones-app:latest
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspecciones}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inspecciones}?schema=public
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Proxy inverso con certificado HTTPS automático (Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN (p.ej. inspecciones.miempresa.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddydata:
