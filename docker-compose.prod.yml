# Despliegue completo en UN servidor (staging o producción):
#   PostgreSQL + MinIO (fotos) + migraciones + aplicación + Caddy (HTTPS automático)
#
#   cp .env.production.example .env.production   # completar valores reales
#   ln -sf .env.production .env                    # compose lee las variables de .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Guía paso a paso: docs/DESPLIEGUE.md
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspecciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-inspecciones}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspecciones}"]
      interval: 5s
      retries: 10

  # Almacenamiento S3-compatible para fotos y documentos (bucket privado).
  # Alternativa: usar AWS S3 o Cloudflare R2 y quitar estos dos servicios.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Define S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Define S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set none local/$${S3_BUCKET};
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-inspecciones}

  # Aplica migraciones y sincroniza permisos/roles (y crea el administrador inicial).
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspecciones}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inspecciones}?schema=public
      SEED_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspecciones}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inspecciones}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Proxy inverso con certificado HTTPS automático (Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN (p.ej. inspecciones.miempresa.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  miniodata:
  caddydata:
