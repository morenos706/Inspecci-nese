# Servicios de apoyo para DESARROLLO LOCAL:
#   docker compose up -d
#   PostgreSQL → localhost:5432 · Mailpit (correos de prueba) → http://localhost:8025
# Las fotos se guardan en la carpeta .storage/ (STORAGE_DRIVER=local).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inspecciones
      POSTGRES_PASSWORD: inspecciones
      POSTGRES_DB: inspecciones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspecciones"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
